<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b83280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#ffffff"/>

  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">CBAM-CycleGAN — Bidirectional ISH &#8596; H&amp;E Virtual Staining</text>

  <!-- Real ISH -->
  <rect x="40" y="120" width="150" height="90" rx="10" fill="#fef6e4" stroke="#d9a441" stroke-width="1.5"/>
  <text x="115" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4e0a">Real ISH</text>
  <text x="115" y="180" text-anchor="middle" font-size="11" fill="#7a4e0a">512&#215;512 patch (x)</text>

  <!-- Real HE -->
  <rect x="40" y="410" width="150" height="90" rx="10" fill="#fbe9ef" stroke="#c15a86" stroke-width="1.5"/>
  <text x="115" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f45">Real H&amp;E</text>
  <text x="115" y="470" text-anchor="middle" font-size="11" fill="#7a1f45">512&#215;512 patch (y)</text>

  <!-- Generator G_AB -->
  <rect x="320" y="90" width="230" height="150" rx="12" fill="#eaf2ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="435" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4e8a">Generator G_AB</text>
  <text x="435" y="138" text-anchor="middle" font-size="11" fill="#1a4e8a">ISH &#8594; H&amp;E</text>
  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#1a4e8a">ReflPad-Conv7 encoder</text>
  <text x="435" y="177" text-anchor="middle" font-size="11" fill="#1a4e8a">9 &#215; ResNet block</text>
  <text x="435" y="194" text-anchor="middle" font-size="11" fill="#1a4e8a">+ CBAM @ blocks 3, 6, 9</text>
  <text x="435" y="212" text-anchor="middle" font-size="11" fill="#1a4e8a">transposed-conv decoder</text>

  <!-- Generator G_BA -->
  <rect x="320" y="380" width="230" height="150" rx="12" fill="#fdeef5" stroke="#b83280" stroke-width="1.5"/>
  <text x="435" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#7a1f56">Generator G_BA</text>
  <text x="435" y="428" text-anchor="middle" font-size="11" fill="#7a1f56">H&amp;E &#8594; ISH</text>
  <text x="435" y="450" text-anchor="middle" font-size="11" fill="#7a1f56">ReflPad-Conv7 encoder</text>
  <text x="435" y="467" text-anchor="middle" font-size="11" fill="#7a1f56">9 &#215; ResNet block</text>
  <text x="435" y="484" text-anchor="middle" font-size="11" fill="#7a1f56">+ CBAM @ blocks 3, 6, 9</text>
  <text x="435" y="502" text-anchor="middle" font-size="11" fill="#7a1f56">transposed-conv decoder</text>

  <!-- Fake HE -->
  <rect x="660" y="120" width="150" height="90" rx="10" fill="#fbe9ef" stroke="#c15a86" stroke-width="1.5"/>
  <text x="735" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#7a1f45">Fake H&amp;E</text>
  <text x="735" y="174" text-anchor="middle" font-size="11" fill="#7a1f45">G_AB(x)</text>
  <text x="735" y="191" text-anchor="middle" font-size="10" fill="#7a1f45">vs. D_B</text>

  <!-- Fake ISH -->
  <rect x="660" y="410" width="150" height="90" rx="10" fill="#fef6e4" stroke="#d9a441" stroke-width="1.5"/>
  <text x="735" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4e0a">Fake ISH</text>
  <text x="735" y="464" text-anchor="middle" font-size="11" fill="#7a4e0a">G_BA(y)</text>
  <text x="735" y="481" text-anchor="middle" font-size="10" fill="#7a4e0a">vs. D_A</text>

  <!-- Discriminators -->
  <rect x="900" y="120" width="150" height="90" rx="10" fill="#eef1f5" stroke="#3b4252" stroke-width="1.5"/>
  <text x="975" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">D_B</text>
  <text x="975" y="177" text-anchor="middle" font-size="10" fill="#1a202c">70&#215;70 PatchGAN</text>

  <rect x="900" y="410" width="150" height="90" rx="10" fill="#eef1f5" stroke="#3b4252" stroke-width="1.5"/>
  <text x="975" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">D_A</text>
  <text x="975" y="467" text-anchor="middle" font-size="10" fill="#1a202c">70&#215;70 PatchGAN</text>

  <!-- Reconstructed (cycle) boxes, centered bottom -->
  <rect x="320" y="255" width="230" height="70" rx="10" fill="#f2f7ec" stroke="#5c8a3a" stroke-width="1.5"/>
  <text x="435" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#375420">Reconstructed ISH</text>
  <text x="435" y="298" text-anchor="middle" font-size="10" fill="#375420">G_BA(G_AB(x)) &#8776; x  (L1 + SSIM + Sobel)</text>

  <rect x="320" y="325" width="230" height="46" rx="10" fill="#ffffff" stroke="none"/>

  <!-- Main forward arrows -->
  <line x1="190" y1="165" x2="320" y2="165" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="165" x2="660" y2="165" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="810" y1="165" x2="900" y2="165" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="190" y1="455" x2="320" y2="455" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="455" x2="660" y2="455" stroke="#b83280" stroke-width="2" marker-end="url(#arrowRose)"/>
  <line x1="810" y1="455" x2="900" y2="455" stroke="#3b4252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cycle path: Fake HE -> G_BA -> Reconstructed ISH -->
  <path d="M 735 210 L 735 290 L 550 290" fill="none" stroke="#5c8a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="700" y="245" font-size="10" fill="#375420" text-anchor="middle">through G_BA</text>

  <!-- Cycle path: Fake ISH -> G_AB -> Reconstructed HE (mirrored, upper dashed) -->
  <rect x="320" y="335" width="230" height="0" fill="none"/>
  <path d="M 660 455 L 620 455 L 620 340 L 550 340" fill="none" stroke="#8a5c3a" stroke-width="0" opacity="0"/>

  <!-- Identity mapping annotations -->
  <text x="435" y="255" text-anchor="middle" font-size="10" fill="#7a4e0a">identity: G_BA(x) &#8776; x (&#955;=0.5)</text>
  <text x="435" y="545" text-anchor="middle" font-size="10" fill="#1a4e8a">identity: G_AB(y) &#8776; y (&#955;=0.5)</text>

  <!-- Reconstructed HE box (mirrors) -->
  <rect x="320" y="560" width="230" height="0" fill="none"/>

  <!-- CBAM callout -->
  <rect x="40" y="255" width="230" height="90" rx="10" fill="#f6f2fb" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="155" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#44337a">CBAM Attention</text>
  <text x="155" y="296" text-anchor="middle" font-size="10" fill="#44337a">Channel: avg/max pool &#8594; MLP (r=16)</text>
  <text x="155" y="311" text-anchor="middle" font-size="10" fill="#44337a">Spatial: 7&#215;7 conv on avg/max maps</text>
  <text x="155" y="328" text-anchor="middle" font-size="10" fill="#44337a">Inserted after residual blocks 3, 6, 9</text>

  <line x1="270" y1="300" x2="320" y2="240" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="270" y1="300" x2="320" y2="380" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="900" y="270" font-size="11" fill="#3b4252" font-weight="700">Loss terms</text>
  <text x="900" y="288" font-size="10" fill="#3b4252">L_adv &#8226; LSGAN, both directions</text>
  <text x="900" y="304" font-size="10" fill="#3b4252">L_cyc &#8226; &#955;=10, L1 round-trip</text>
  <text x="900" y="320" font-size="10" fill="#3b4252">L_id &#8226; &#955;=0.5, target-domain guard</text>
  <text x="900" y="336" font-size="10" fill="#3b4252">L_ssim &#8226; &#955;=2.0, cycle structure</text>
  <text x="900" y="352" font-size="10" fill="#3b4252">L_edge &#8226; &#955;=1.0, Sobel boundaries</text>

  <text x="590" y="600" text-anchor="middle" font-size="11" fill="#718096">Unpaired training on adjacent (&#8764;20&#181;m) IvyGAP CD44 sections &#8212; cycle consistency substitutes for pixel-level pairing.</text>
</svg>
